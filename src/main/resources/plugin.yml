name: ZartraGUI
version: 1.1.5
main: net.zartra.gui.ZartraGUIPlugin
authors: [Zartra]
softdepend: [PlaceholderAPI, Vault, Multiverse-Core, HeadDatabase, PlayerPoints]
commands:
  zgui:
    description: ZartraGUI administration
    aliases: [zartragui, guimaker, gui]
  _zgui_picker:
    description: Internal secure color-picker action
    permission: zartragui.edit
permissions:
  zartragui.admin: {default: op}
  zartragui.create: {default: op}
  zartragui.edit: {default: op}
  zartragui.delete: {default: op}
  zartragui.open: {default: op}
  zartragui.open.others: {default: op}
  zartragui.reload: {default: op}
  zartragui.preview: {default: op}
  zartragui.duplicate: {default: op}
  zartragui.import: {default: op}
  zartragui.export: {default: op}
  zartragui.debug: {default: op}
